name: Deploy to GitHub Pages

on:
  # Minden main-re történő push után újraépít és deployol.
  push:
    branches: [main]
  # Kézi indítás is lehetséges az Actions fülről.
  workflow_dispatch:

# A GITHUB_TOKEN jogosultságai a Pages deploy-hoz.
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy deploy fusson; a futó deployt nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm install lockfile nélkül is működik; ha később bekerül a
        # package-lock.json, nyugodtan cserélhető gyorsabb `npm ci`-re.
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
