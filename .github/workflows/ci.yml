name: CI build check

# Pull requesteken és main-push-on ellenőrzi, hogy a projekt tényleg fordul
# (tsc -b && vite build). Nem deployol – ez a PR-ek build-verifikációja.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (type-check + bundle)
        run: npm run build
