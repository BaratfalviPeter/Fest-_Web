    <!-- SPA-fallback visszaállítás (spa-github-pages): a 404.html által
         query-stringbe kódolt útvonalat visszaírja a valódi URL-re, még a
         React betöltése előtt, hogy a router a helyes útvonalat lássa. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
